<div class="font-size" role="group" aria-label="{{t:common.fonts.label}}">
  <button type="button" class="font-size__btn" data-font-step="-2" aria-label="A--" title="{{t:common.fonts.smallest}}">A--</button>
  <button type="button" class="font-size__btn" data-font-step="-1" aria-label="A-" title="{{t:common.fonts.smaller}}">A-</button>
  <button type="button" class="font-size__btn is-active" data-font-step="0" aria-label="A" title="{{t:common.fonts.medium}}">A</button>
  <button type="button" class="font-size__btn" data-font-step="1" aria-label="A+" title="{{t:common.fonts.larger}}">A+</button>
  <button type="button" class="font-size__btn" data-font-step="2" aria-label="A++" title="{{t:common.fonts.largest}}">A++</button>
</div>
