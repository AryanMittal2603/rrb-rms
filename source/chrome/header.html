<header class="masthead">
  <div class="masthead__inner">
    <picture class="masthead__emblem"><source type="image/webp" srcset="{{brand:emblem.webp}}"><img src="{{brand:emblem.png}}" alt="{{t:common.masthead.emblem}}" width="48" height="80"></picture>
    <p class="masthead__title">{{t:common.masthead.title}}<br>{{t:common.masthead.ministry}}</p>
    <picture class="masthead__logo"><source type="image/webp" srcset="{{brand:railway-logo.webp}}"><img src="{{brand:railway-logo.png}}" alt="{{t:common.masthead.logo}}" width="80" height="80"></picture>
  </div>
</header>
